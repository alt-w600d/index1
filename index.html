<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Добавить инструкцию КИПиА</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    h2 { margin: 0 0 8px 0; font-size: 20px; }
    p.subtitle { color: #94a3b8; font-size: 13px; margin: 0 0 20px 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    input[type="text"], select, textarea {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 16px;
      font-size: 14px;
    }
    textarea { resize: vertical; min-height: 80px; }
    .file-input-wrapper {
      border: 1px dashed #334155;
      padding: 12px;
      text-align: center;
      border-radius: 6px;
      margin-bottom: 16px;
      background: #182234;
    }
    .btn-submit {
      width: 100%;
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    #status-box { margin-top: 16px; }
    .success-alert {
      background-color: #0f291e;
      border: 1px solid #10b981;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    .success-alert h4 { color: #34d399; margin: 0 0 8px 0; }
    .success-alert p { font-size: 13px; color: #cbd5e1; margin: 0 0 12px 0; line-height: 1.4; }
    .hlp-link {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .error-alert {
      background-color: #3f1d24;
      border: 1px solid #f43f5e;
      color: #fda4af;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="card">
  <span class="badge">Предложить материал</span>
  <h2>Добавить инструкцию КИПиА</h2>
  <p class="subtitle">Отправьте схему, мануал или описание настройки. После модерации публикация появится в базе знаний.</p>

  <form id="instruction-form">
    <label>Название прибора / Инструкции</label>
    <input type="text" name="title" required placeholder="Введите название..." />

    <label>Раздел / Оборудование</label>
    <select name="category" required>
      <option value="Приёмка и Хранение молока">Приёмка и Хранение молока</option>
      <option value="Сырный цех">Сырный цех</option>
      <option value="Пастеризация">Пастеризация</option>
      <option value="Другое">Другое</option>
    </select>

    <label>Описание / Пошаговый алгоритм</label>
    <textarea name="description" required placeholder="Опишите алгоритм..."></textarea>

    <label>Фотография или видео (необязательно)</label>
    <div class="file-input-wrapper">
      <input type="file" name="file" id="file-input" accept="image/*,video/*" />
    </div>

    <button type="submit" id="submit-btn" class="btn-submit">Отправить на модерацию</button>
  </form>

  <div id="status-box"></div>
</div>

<script>
  const form = document.getElementById('instruction-form');
  const statusBox = document.getElementById('status-box');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'Отправка...';
    statusBox.innerHTML = '';

    const formData = new FormData(form);

    try {
      const response = await fetch('/api/instructions', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (response.ok && data.success) {
        form.reset();
        statusBox.innerHTML = `
          <div class="success-alert">
            <h4>🎉 Инструкция успешно отправлена!</h4>
            <p>Модерация администратором может составить <b>от 1 до 30 минут</b>.</p>
            <a href="https://hlp-keep.vercel.app" target="_blank" class="hlp-link">Перейти на HLP Keep ↗</a>
          </div>
        `;
      } else {
        throw new Error(data.error || 'Ошибка при отправке');
      }
    } catch (err) {
      statusBox.innerHTML = `<div class="error-alert">${err.message}</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Отправить на модерацию';
    }
  });
</script>

</body>
</html>
