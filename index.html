<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>База знаний КИПиА — Добавление материала</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --accent-orange: #f97316;
      --accent-orange-hover: #ea580c;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #030712;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .terminal-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-top: 3px solid var(--accent-orange);
      border-radius: 4px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
    }

    .system-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .system-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent-orange);
      text-transform: uppercase;
    }

    .system-status {
      font-size: 10px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 6px;
      border-radius: 2px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 6px 0;
      letter-spacing: 0.5px;
    }

    p.description {
      color: var(--text-muted);
      font-size: 12px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="text"], select, textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 2px;
      box-sizing: border-box;
      margin-bottom: 18px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-orange);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .file-container {
      border: 1px dashed var(--panel-border);
      background-color: var(--input-bg);
      padding: 14px;
      text-align: center;
      border-radius: 2px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-action {
      width: 100%;
      background-color: var(--accent-orange);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 2px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: var(--accent-orange-hover);
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status-container {
      margin-top: 16px;
    }

    .alert-success {
      background-color: rgba(16, 185, 129, 0.08);
      border: 1px solid #10b981;
      padding: 16px;
      border-radius: 2px;
      text-align: center;
    }

    .alert-success h4 {
      color: #34d399;
      margin: 0 0 6px 0;
      font-size: 14px;
      text-transform: uppercase;
    }

    .alert-success p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    .link-btn {
      display: inline-block;
      background-color: transparent;
      border: 1px solid #34d399;
      color: #34d399;
      padding: 6px 14px;
      border-radius: 2px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .link-btn:hover {
      background-color: #34d399;
      color: #000;
    }

    .alert-error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 12px;
      border-radius: 2px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="terminal-card">
  <div class="system-header">
    <span class="system-title">Модуль КИПиА // База данных</span>
    <span class="system-status">ONLINE</span>
  </div>

  <h1>Добавление инструкции</h1>
  <p class="description">Заполните технические параметры, приложите схему или мануал. Материал поступит в обработку.</p>

  <form id="instruction-form">
    <label>Название прибора / Узла</label>
    <input type="text" name="title" required placeholder="Например: Преобразователь давления МИДА..." />

    <label>Раздел / Оборудование</label>
    <select name="category" required>
      <option value="Приёмка и Хранение молока">Приёмка и Хранение молока</option>
      <option value="Сырный цех">Сырный цех</option>
      <option value="Пастеризация">Пастеризация</option>
      <!-- Сюда будем добавлять новые разделы по твоему указанию -->
      <option value="Другое">Другое</option>
    </select>

    <label>Техническое описание / Алгоритм</label>
    <textarea name="description" required placeholder="Введите пошаговую инструкцию или параметры настройки..."></textarea>

    <label>Документация / Медиа (опционально)</label>
    <div class="file-container">
      <input type="file" name="file" id="file-input" accept="image/*,video/*" />
    </div>

    <button type="submit" id="submit-btn" class="btn-action">Отправить на модерацию</button>
  </form>

  <div id="status-container"></div>
</div>

<script>
  const form = document.getElementById('instruction-form');
  const statusContainer = document.getElementById('status-container');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'Передача данных...';
    statusContainer.innerHTML = '';

    const formData = new FormData(form);

    try {
      const response = await fetch('/api/instructions', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (response.ok && data.success) {
        form.reset();
        statusContainer.innerHTML = `
          <div class="alert-success">
            <h4>[✓] Запрос отправлен</h4>
            <p>Модерация администратора может составлять от 1 до 30 минут, в зависимости от времени суток.</p>
            <a href="https://hlp-keep.vercel.app" target="_blank" class="link-btn">Перейти на HLP Keep</a>
          </div>
        `;
      } else {
        throw new Error(data.error || 'Ошибка отправки пакета данных');
      }
    } catch (err) {
      statusContainer.innerHTML = `<div class="alert-error">[!] Ошибка: ${err.message}</div>`;
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Отправить на модерацию';
    }
  });
</script>

</body>
</html>
