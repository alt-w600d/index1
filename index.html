<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Предложить инструкцию КИПиА</title>
</head>
<body>
  <h2>Предложить инструкцию по оборудованию</h2>
  <form id="uploadForm">
    <input type="text" id="title" placeholder="Название прибора/оборудования" required><br><br>
    <textarea id="description" placeholder="Описание / Пошаговая инструкция" required></textarea><br><br>
    <input type="file" id="image" accept="image/*" required><br><br>
    <button type="submit">Отправить на модерацию</button>
  </form>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('image', document.getElementById('image').files[0]);

      const response = await fetch('/api/instructions', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      alert(result.message || result.error);
    });
  </script>
</body>
</html>
