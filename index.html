<script>
  const fileInput = document.getElementById('mediaFile');
  const fileNamePreview = document.getElementById('fileNamePreview');
  const form = document.getElementById('uploadForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      fileNamePreview.textContent = `Выбран файл: ${fileInput.files[0].name}`;
    } else {
      fileNamePreview.textContent = '';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Отправка...';
    statusMsg.className = 'status-msg';
    statusMsg.textContent = '';

    try {
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('category', document.getElementById('category').value);
      formData.append('description', document.getElementById('description').value);
      
      if (fileInput.files.length > 0) {
        formData.append('file', fileInput.files[0]);
      }

      const response = await fetch('/api/instructions', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (response.ok) {
        statusMsg.className = 'status-msg success';
        statusMsg.innerHTML = 'Успешно отправлено! Ваша инструкция появится на сайте <a href="https://hlp-kip.vercel.app/" target="_blank" style="color: #38bdf8; text-decoration: underline;">hlp-kip.vercel.app</a> ориентировочно от 1 до 30 минут в зависимости от времени.';
        form.reset();
        fileNamePreview.textContent = '';
      } else {
        throw new Error(result.error || 'Ошибка при отправке');
      }
    } catch (err) {
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Отправить на модерацию';
    }
  });
</script>
